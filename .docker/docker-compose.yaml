services:

  tau-bench:
    build:
      context: .
      dockerfile: Dockerfile-taubench
    image: tau-bench
    container_name: tau-bench
    networks:
      - crm
    ports:
      - 8004:8004
    stdin_open: true
    tty: true
    env_file: ".env-docker-compose"

  open-webui:
    build:
      context: /mnt/my-space/4-local-ai-crm/20-local-crm-ai-research/openwebui/
      dockerfile: /mnt/my-space/4-local-ai-crm/20-local-crm-ai-research/.docker/Dockerfile-openwebui
    image: openwebui
    container_name: openwebui
    networks:
      - crm
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-8080}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434' 
      - 'WEBUI_SECRET_KEY='
      - 'ENABLE_MCP_SERVER=true'
      - 'MCP_ENABLE=true'
    # restart: unless-stopped

  mcp:
      build:
        context: /mnt/my-space/1-ai-agents/3-open-webui/mcpo
        dockerfile: /mnt/my-space/1-ai-agents/3-open-webui/mcpo/Dockerfile
      image: mcp
      volumes:
        - /home/allanmogley/Downloads/mcp.json:/app/config/config.json
      container_name: mcp
      tty: true
      stdin_open: true
      env_file: ".env-docker-compose"
      command:

        # - "mcpo"
        # - "--port"
        # - "8000"
        # - "--"
        # - "uvx"
        # - "mcp-server-time"
        # - "--local-timezone=Europe/Budapest"


        - mcpo
        - --port
        - "8001"
        # - "--"
        # - "uvx"
        - --server-type
        - streamable-http
        - --header
        - '{"Authorization": "Bearer ${MCP_BEARER_TOKEN}"}'
        - --
        - http://server:3000/mcp
      
      networks:
        - crm
      ports:
        - 8001:8000

networks:
  crm:
    driver: bridge

volumes:
  ollama: {}
  open-webui: {}